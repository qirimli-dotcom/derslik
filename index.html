<!doctype html>
<html lang="crh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Derslik Çantam</title>
<meta name="description" content="Bütün derslikler bir yerde">
<meta name="theme-color" content="#2F5BD3">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Çantam">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="app.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="logo" viewBox="0 0 180 180"><rect width="180" height="180" rx="40" fill="#2F5BD3"/><rect x="48" y="34" width="24" height="56" rx="3" fill="#FFFFFF"/><rect x="76" y="24" width="24" height="66" rx="3" fill="#A9BEF5"/><rect x="104" y="38" width="22" height="52" rx="3" fill="#FFFFFF" transform="rotate(9 115 90)"/><rect x="80" y="34" width="16" height="5" rx="2" fill="#2F5BD3"/><rect x="28" y="76" width="124" height="76" rx="18" fill="#F2A33A"/><path d="M28 94 a18 18 0 0 1 18 -18 h88 a18 18 0 0 1 18 18 v12 h-124 z" fill="#D9821C"/><rect x="78" y="98" width="24" height="18" rx="5" fill="#1B2233"/></symbol>
  <g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
  <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
  <symbol id="i-shelf" viewBox="0 0 24 24"><path d="M4 19V5M9 19V5M14 19l-2-14M18 19l2-13M3 19h18"/></symbol>
  <symbol id="i-grid" viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><rect x="14" y="14" width="6" height="6" rx="1"/></symbol>
  <symbol id="i-book" viewBox="0 0 24 24"><path d="M4 5h6a2 2 0 0 1 2 2v12a2 2 0 0 0-2-2H4zM20 5h-6a2 2 0 0 0-2 2v12a2 2 0 0 1 2-2h6z"/></symbol>
  <symbol id="i-down" viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></symbol>
  <symbol id="i-mark" viewBox="0 0 24 24"><path d="M6 4h12v16l-6-4-6 4z"/></symbol>
  <symbol id="i-lang" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M4 12h16M12 4a12 12 0 0 1 0 16M12 4a12 12 0 0 0 0 16"/></symbol>
  <symbol id="i-help" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M10 10a2 2 0 1 1 3 1.7c-.7.4-1 1-1 1.8M12 16.5v.01"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
  <symbol id="i-next" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 6v12M6 12h12"/></symbol>
  <symbol id="i-minus" viewBox="0 0 24 24"><path d="M6 12h12"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M5 7h14M10 7V5h4v2M7 7l1 13h8l1-13"/></symbol>
  <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c1.5-4 4.5-6 8-6s6.5 2 8 6"/></symbol>
  <symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 19c1-3.5 3.5-5 6.5-5s5.5 1.5 6.5 5M16 4.5a3.5 3.5 0 0 1 0 7M18 14c2 .6 3.2 2.3 3.8 5"/></symbol>
  <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 16V5M7 10l5-5 5 5M5 20h14"/></symbol>
  <symbol id="i-key" viewBox="0 0 24 24"><circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M16 7l3 3"/></symbol>
  <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></symbol>
  <symbol id="i-out" viewBox="0 0 24 24"><path d="M14 4h4a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-4M10 16l-4-4 4-4M6 12h10"/></symbol>
  <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6 7 7M17 17l1.4 1.4M5.6 18.4 7 17M17 7l1.4-1.4"/></symbol>
  <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 4.5-3.4 8-8 9-4.6-1-8-4.5-8-9V6z"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></symbol>
  <symbol id="i-swap" viewBox="0 0 24 24"><path d="M4 8h14l-3-3M20 16H6l3 3"/></symbol>
  </g>
</svg>

<div id="app">
  <aside class="side">
    <div class="brand"><svg class="logo"><use href="#logo"/></svg><b id="sideName"></b></div>
    <button class="side-user" id="sideUser" data-view="profile"></button>
    <div class="side-label" id="sideGradesLabel"></div>
    <div class="side-grades" id="sideGrades"></div>
    <div class="side-links" id="sideLinks"></div>
  </aside>
  <div class="main">
    <header class="top">
      <div class="brand"><svg class="logo"><use href="#logo"/></svg><b id="topName"></b></div>
      <button class="ib white" id="menuBtn"><svg><use href="#i-menu"/></svg></button>
    </header>
    <main id="view"></main>
  </div>
  <nav class="tabs" id="tabs"></nav>
</div>

<div class="sheet" id="menu" hidden>
  <div class="sheet-head"><h2 id="menuTitle"></h2><button class="ib" id="menuClose"><svg><use href="#i-x"/></svg></button></div>
  <div id="menuBody"></div>
</div>

<div class="reader" id="reader" hidden>
  <header class="rbar">
    <button class="ib" id="rBack"><svg><use href="#i-back"/></svg></button>
    <div class="rtitle"><b id="rTitle"></b><small id="rSub"></small></div>
    <button class="ib wide-only" id="rZoomOut"><svg><use href="#i-minus"/></svg></button>
    <button class="ib wide-only" id="rZoomIn"><svg><use href="#i-plus"/></svg></button>
    <button class="ib" id="rMark"><svg><use href="#i-mark"/></svg></button>
    <button class="ib dl" id="rDl"><svg><use href="#i-down"/></svg><span></span></button>
  </header>
  <div class="stage" id="stage"></div>
  <footer class="rfoot" id="rFoot">
    <button class="ib big" id="rPrev"><svg><use href="#i-back"/></svg></button>
    <input type="range" id="rRange" min="1" max="1" value="1">
    <div class="pnum" id="rNum"></div>
    <button class="ib big accent" id="rNext"><svg><use href="#i-next"/></svg></button>
  </footer>
</div>

<div class="auth" id="auth" hidden>
  <div class="auth-box">
    <div class="auth-brand"><svg class="logo"><use href="#logo"/></svg><h1 id="aTitle"></h1><p id="aSlogan"></p></div>
    <div id="authBody"></div>
  </div>
</div>

<div class="modal" id="modal" hidden><div class="modal-box" id="modalBox"></div></div>

<div class="toast" id="toast" role="status"></div>

<script src="strings.js"></script>
<script src="qrcode.js"></script>
<script src="common.js"></script>
<script src="pdfjs/pdf.min.js"></script>
<script src="app.js"></script>
</body>
</html>
